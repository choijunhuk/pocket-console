name: Original 3DS homebrew

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build original 3DS homebrew
        run: ./scripts/build-3ds-homebrew.sh
      - uses: actions/upload-artifact@v4
        with:
          name: three-ds-homebrew
          path: tests/three_ds/smoke.3dsx
          if-no-files-found: error
