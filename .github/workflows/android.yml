name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check file classification
        run: ./scripts/test-model.sh
      - name: Build and lint
        run: ./gradlew --no-daemon lintDebug assembleDebug
      - name: Explain lint failures
        if: failure()
        run: |
          report=app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if [ -f "$report" ]; then cat "$report"; fi
      - name: Upload debug APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocket-console-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
