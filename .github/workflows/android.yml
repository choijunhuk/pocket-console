name: Android

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect-existing-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-native-smoke
          run-id: 43091081465
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: failure-artifact
      - name: Read bounded failure evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("failure-artifact")
          for name in ("android-failure-logcat.txt", "android-failure-activities.txt"):
              paths = list(root.rglob(name))
              if len(paths) != 1:
                  raise SystemExit(f"Expected one {name}, got {len(paths)}")
              path = paths[0]
              print(f"FILE {name} bytes={path.stat().st_size}")
              text = path.read_text(errors="replace")
              terms = ("dev.pocketconsole", "AndroidRuntime", "FATAL EXCEPTION",
                       "ActivityTaskManager", "ActivityManager", "WindowManager",
                       "InputDispatcher", "Pocket", "ANR", "crash", "Exception")
              lines = [line for line in text.splitlines() if any(term in line for term in terms)]
              print(f"MATCHES {name}={len(lines)}")
              for line in lines[-90:]:
                  print(line[:360])
          PY
