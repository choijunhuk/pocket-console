name: 3DS host smoke

on:
  workflow_call:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: three-ds-homebrew
          path: tests/three_ds
      - name: Verify installed software graphics runtime
        run: |
          dpkg-query -W libgl1 libgl1-mesa-dri libx11-6 xvfb
          ldconfig -p | grep -F libGL.so.1
          ldconfig -p | grep -F libX11.so.6
          ldconfig -p | grep -E 'libGLX|libGLdispatch' || true
          command -v xvfb-run
          test -r /usr/lib/x86_64-linux-gnu/dri/swrast_dri.so
      - name: Verify official host test core
        run: |
          mkdir -p .cache/three_ds-core
          curl -fL 'https://github.com/azahar-emu/azahar/releases/download/2126.2/azahar-libretro-linux-x86_64-2126.2.zip' -o .cache/three_ds-core/core.zip
          echo '2223444b74de2c922bae1efcfed60002f696b3c2aaf4fc73fc03e66a395dc26e  .cache/three_ds-core/core.zip' | sha256sum --check
          unzip -p .cache/three_ds-core/core.zip '*azahar_libretro.so' > .cache/three_ds-core/libazahar_libretro.so
          test -s .cache/three_ds-core/libazahar_libretro.so
      - name: Run actual 3DS core
        run: timeout --kill-after=10 180 ./scripts/test-3ds-native.sh tests/three_ds/smoke.3dsx .cache/three_ds-core/libazahar_libretro.so
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-ds-host-frame
          path: .cache/three_ds-native/runtime/*.ppm
          if-no-files-found: warn

  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: three-ds-homebrew
          path: tests/three_ds
      - name: Verify installed software graphics runtime
        run: |
          dpkg-query -W libgl1 libgl1-mesa-dri libx11-6 xvfb
          ldconfig -p | grep -F libGL.so.1
          ldconfig -p | grep -F libX11.so.6
          command -v xvfb-run
          test -r /usr/lib/x86_64-linux-gnu/dri/swrast_dri.so
      - name: Identify host compiler
        id: toolchain
        run: echo "version=$(c++ -dumpfullversion)-$(cmake --version | head -1 | tr ' ' '_')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: host-build-cache
        with:
          path: .cache/azahar-host-build
          key: azahar-host-${{ runner.os }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('third_party/azahar.lock.json', 'patches/azahar-retro-run-error.patch') }}-${{ hashFiles('patches/azahar-host-render-diag.patch', 'scripts/prepare-3ds-source.py', 'scripts/build-3ds-host-diagnostic.sh') }}
          restore-keys: |
            azahar-host-${{ runner.os }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('third_party/azahar.lock.json', 'patches/azahar-retro-run-error.patch') }}-
      - name: Build exact-pinned diagnostic core
        run: ./scripts/build-3ds-host-diagnostic.sh
      - name: Verify diagnostic source patch
        run: python3 -m unittest tests/test_azahar_host_diagnostic.py
      - uses: actions/cache/save@v4
        if: steps.host-build-cache.outputs.cache-hit != 'true'
        with:
          path: .cache/azahar-host-build
          key: azahar-host-${{ runner.os }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('third_party/azahar.lock.json', 'patches/azahar-retro-run-error.patch') }}-${{ hashFiles('patches/azahar-host-render-diag.patch', 'scripts/prepare-3ds-source.py', 'scripts/build-3ds-host-diagnostic.sh') }}
      - name: Run diagnostic 3DS core with real homebrew
        run: timeout --kill-after=10 180 ./scripts/test-3ds-native.sh tests/three_ds/smoke.3dsx .cache/three_ds-core-diagnostic/libazahar_libretro.so
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-ds-host-diagnostic-frame
          path: .cache/three_ds-native/runtime/*.ppm
          if-no-files-found: warn
