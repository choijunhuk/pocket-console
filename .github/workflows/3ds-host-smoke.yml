name: 3DS host smoke

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install software graphics support
        run: sudo apt-get update && sudo apt-get install -y libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dri
      - name: Build original 3DS homebrew
        run: ./scripts/build-3ds-homebrew.sh
      - name: Verify official host test core
        run: |
          mkdir -p .cache/three_ds-core
          curl -fL 'https://github.com/azahar-emu/azahar/releases/download/2126.2/azahar-libretro-linux-x86_64-2126.2.zip' -o .cache/three_ds-core/core.zip
          echo '2223444b74de2c922bae1efcfed60002f696b3c2aaf4fc73fc03e66a395dc26e  .cache/three_ds-core/core.zip' | sha256sum --check
          unzip -p .cache/three_ds-core/core.zip '*azahar_libretro.so' > .cache/three_ds-core/libazahar_libretro.so
          test -s .cache/three_ds-core/libazahar_libretro.so
      - name: Run actual 3DS core
        run: timeout 180 ./scripts/test-3ds-native.sh tests/three_ds/smoke.3dsx .cache/three_ds-core/libazahar_libretro.so
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-ds-homebrew
          path: tests/three_ds/smoke.3dsx
          if-no-files-found: warn
