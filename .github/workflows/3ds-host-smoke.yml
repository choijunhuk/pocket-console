name: 3DS host smoke

on:
  workflow_call:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: three-ds-homebrew
          path: tests/three_ds
      - name: Install software graphics support
        run: |
          dpkg-query -W libegl-dev libgl-dev libgles-dev libgl1-mesa-dri || true
          ls -l /usr/include/EGL/egl.h /usr/lib/x86_64-linux-gnu/libEGL.so /usr/lib/x86_64-linux-gnu/dri/swrast_dri.so || true
          if ! pkg-config --exists egl gl glesv2 || ! test -f /usr/lib/x86_64-linux-gnu/dri/swrast_dri.so; then
            # A signed Ubuntu snapshot avoids the repeatedly stalled default mirror.
            source="$RUNNER_TEMP/graphics.sources"
            cat > "$source" <<'EOF'
          Types: deb
          URIs: https://snapshot.ubuntu.com/ubuntu/20261110T000000Z/
          Suites: noble noble-updates noble-security
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          Check-Valid-Until: no
          EOF
            options=(-o "Dir::Etc::sourcelist=$source" -o Dir::Etc::sourceparts=- -o Acquire::ForceIPv4=true -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
            sudo timeout 180 apt-get "${options[@]}" update
            sudo timeout 240 apt-get "${options[@]}" -o DPkg::Lock::Timeout=60 install -y --no-install-recommends libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dri
          fi
          pkg-config --modversion egl gl glesv2
      - name: Verify official host test core
        run: |
          mkdir -p .cache/three_ds-core
          curl -fL 'https://github.com/azahar-emu/azahar/releases/download/2126.2/azahar-libretro-linux-x86_64-2126.2.zip' -o .cache/three_ds-core/core.zip
          echo '2223444b74de2c922bae1efcfed60002f696b3c2aaf4fc73fc03e66a395dc26e  .cache/three_ds-core/core.zip' | sha256sum --check
          unzip -p .cache/three_ds-core/core.zip '*azahar_libretro.so' > .cache/three_ds-core/libazahar_libretro.so
          test -s .cache/three_ds-core/libazahar_libretro.so
      - name: Run actual 3DS core
        run: timeout --kill-after=10 180 ./scripts/test-3ds-native.sh tests/three_ds/smoke.3dsx .cache/three_ds-core/libazahar_libretro.so
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-ds-host-frame
          path: .cache/three_ds-native/runtime/*.ppm
          if-no-files-found: warn
